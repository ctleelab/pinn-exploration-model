[workspace]
authors = ["Atsushi Matsuda <atsumat@uw.edu", "Semin Kim <minismk@uw.edu>", "Matthew Akamatsu <akamatsm@uw.edu>", "Christopher T. Lee <ctlee@ucsd.edu>"]
channels = ["conda-forge"]
name = "pinn-exploration-model"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
biconcave = "cd scripts; python pinn_biconcave.py"

[dependencies]
python = "==3.13"
ipykernel = ">=7.1.0,<8"
tqdm = ">=4.67.1,<5"
numpy = ">=2.3.5,<3"
matplotlib-base = ">=3.10.8,<4"
mrcfile = ">=1.5.4,<2"
scikit-image = ">=0.25.2,<0.26"
ipywidgets = ">=8.1.8,<9"

[pypi-dependencies]
jax = { version = ">=0.8.1, <0.9", extras = ["cuda12"] }
optax = ">=0.2.6, <0.3"
flax = ">=0.12.1, <0.13"
# Add local packages
pinn = { path = "src/pinn", editable = true }
data_generation = { path = "src/data_generation", editable = true }
